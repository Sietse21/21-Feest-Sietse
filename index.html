```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21-Diner Sietse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at top, #302719 0%, #121212 55%, #080808 100%);
      color: #f5f0e5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 42px 28px;
      border: 1px solid #b99a56;
      border-radius: 8px;
      background: rgba(12, 12, 12, 0.92);
      box-shadow: 0 0 40px rgba(185, 154, 86, 0.12);
      text-align: center;
    }

    .eyebrow {
      color: #c9aa68;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-family: Arial, sans-serif;
      font-size: 11px;
    }

    h1 {
      color: #d6b875;
      font-size: clamp(36px, 8vw, 54px);
      font-weight: normal;
      margin: 22px 0 10px;
    }

    .divider {
      width: 70px;
      height: 1px;
      background: #b99a56;
      margin: 26px auto;
    }

    p {
      line-height: 1.8;
      color: #ded8cc;
    }

    .intro {
      font-size: 18px;
    }

    .note {
      margin-top: 30px;
      color: #b99a56;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 34px 20px;
      }

      .eyebrow {
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="eyebrow">Een bijzondere gelegenheid</div>

    <h1>21-Diner Sietse</h1>

    <div class="divider"></div>

    <p class="intro">
      Je bent persoonlijk uitgenodigd.
    </p>

    <p>
      Sommige momenten zijn te bijzonder om zomaar voorbij te laten gaan.
      Daarom nodig ik je uit om samen een bijzondere avond te vieren.
    </p>

    <div class="divider"></div>

    <p class="note">EEN PERSOONLIJKE UITNODIGING</p>
  </main>
</body>
</html>
